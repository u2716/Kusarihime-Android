name: Android (min SDK 26)
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK + NDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
      - name: Install test fonts (for cargo test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-ipafont-gothic fonts-ipafont-mincho fonts-wqy-zenhei
          ls -l /usr/share/fonts/opentype/ipafont-gothic/ipag.ttf /usr/share/fonts/opentype/ipafont-mincho/ipam.ttf /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || cargo install cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Rust core (host)
        run: cargo test --manifest-path src/core/Cargo.toml --release
      - name: Build Rust .so for Android
        run: |
          cd src/core
          cargo ndk -t arm64-v8a -t x86_64 -o ../android/app/src/main/jniLibs build --release
          find ../android/app/src/main/jniLibs -name "*.so" -print
      - name: Bundle open-source fonts into assets/Fonts
        run: |
          # fonts already installed by 'Install test fonts' step above, just copy them
          mkdir -p src/android/app/src/main/assets/Fonts
          cp /usr/share/fonts/opentype/ipafont-gothic/ipag.ttf src/android/app/src/main/assets/Fonts/jp_gothic.ttf
          cp /usr/share/fonts/opentype/ipafont-mincho/ipam.ttf src/android/app/src/main/assets/Fonts/jp_mincho.ttf
          cp /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc src/android/app/src/main/assets/Fonts/chs_hei.ttf
          ls -lh src/android/app/src/main/assets/Fonts/
      - name: Build debug APK with Gradle
        run: gradle -p src/android assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: fujihime-android-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
