name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK + NDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-ipafont-gothic fonts-ipafont-mincho fonts-wqy-zenhei
          ls -l /usr/share/fonts/opentype/ipafont-gothic/ipag.ttf /usr/share/fonts/opentype/ipafont-mincho/ipam.ttf /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || cargo install cargo-ndk

      - uses: gradle/actions/setup-gradle@v4

      - name: Check Rust core (host)
        run: cargo test --manifest-path src/core/Cargo.toml --release

      - name: Build Rust .so for Android
        run: |
          cd src/core
          cargo ndk -t arm64-v8a -t x86_64 -o ../android/app/src/main/jniLibs build --release
          find ../android/app/src/main/jniLibs -name "*.so" -print

      - name: Bundle open-source fonts into assets/Fonts
        run: |
          mkdir -p src/android/app/src/main/assets/Fonts
          cp /usr/share/fonts/opentype/ipafont-gothic/ipag.ttf src/android/app/src/main/assets/Fonts/jp_gothic.ttf
          cp /usr/share/fonts/opentype/ipafont-mincho/ipam.ttf src/android/app/src/main/assets/Fonts/jp_mincho.ttf
          cp /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc src/android/app/src/main/assets/Fonts/chs_hei.ttf
          ls -lh src/android/app/src/main/assets/Fonts/

      - name: Check signing secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then echo "Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then echo "Missing secret ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          if [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then echo "Missing secret ANDROID_KEY_ALIAS"; exit 1; fi
          if [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then echo "Missing secret ANDROID_KEY_PASSWORD"; exit 1; fi
          echo "Signing secrets present"

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/release.keystore
          ls -lh $GITHUB_WORKSPACE/release.keystore

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "Tag: $GITHUB_REF_NAME -> versionName: $TAG, versionCode: $GITHUB_RUN_NUMBER"
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$TAG\"/" src/android/app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $GITHUB_RUN_NUMBER/" src/android/app/build.gradle.kts
          grep -E "versionName|versionCode" src/android/app/build.gradle.kts

      - name: Build signed release APK with Gradle
        run: |
          gradle -p src/android assembleRelease --stacktrace --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK is signed
        run: |
          APK=$(ls src/android/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK"
          ls -lh src/android/app/build/outputs/apk/release/
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner verify --verbose "$APK"
          cp "$APK" "腐り姫～euthanasia～-${GITHUB_REF_NAME}.apk"
          ls -lh 腐り姫～euthanasia～-*.apk

      - uses: actions/upload-artifact@v5
        with:
          name: 腐り姫～euthanasia～-android-release-${{ github.ref_name }}
          path: 腐り姫～euthanasia～-*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 腐り姫～euthanasia～ ${{ github.ref_name }}
          generate_release_notes: true
          files: 腐り姫～euthanasia～-*.apk